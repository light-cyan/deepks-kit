# to use this file, simply add its name as another argument
# in the command line after the main args.yaml
# for example, `deepks iterate args.yaml slurm.yaml`
# this overwrites the settings specified in the main file

scf_machine:
  # every system will be run as a separate command (a task)
  sub_size: 1
  # 2 tasks will be gathered into one Slurm job
  group_size: 2
  dispatcher:
    context: local
    batch: slurm
    remote_profile: null # use lazy local staging
  resources:
    numb_gpu: 1
    envs:
      PYSCF_MAX_MEMORY: 8000 # increase from 4G to 8G
  python: "python" # use python in path

train_machine:
  dispatcher:
    context: local
    batch: slurm
    remote_profile: null # use lazy local staging
  resources:
    numb_gpu: 1
  python: "python" # use python in path
