model_args:
  hidden_sizes: [100, 100, 100] 
  output_scale: 100
  use_resnet: true
  actv_fn: mygelu
projector_basis:
  - [0, [0.8, 1.0]]
  - [1, [0.3, 1.0]]
data_args: 
  batch_size: 16
  group_batch: 1
  energy_name: e_corr_target
  descriptor_name: descriptor
  force_name: f_corr_target
  jacobian_name: dq_dR_relaxed
  force_mode: deephf_relaxed
preprocess_args:
  preshift: false 
  prescale: false
  prefit_ridge: 1e1
  prefit_trainable: false
train_args: 
  ckpt_file: model.pth
  decay_rate: 0.5
  decay_steps: 1000
  display_epoch: 100
  force_factor: 0.1
  n_epoch: 5000
  start_lr: 0.0001
train_paths:
  - data_train/* 
test_paths:
  - data_test/*
