[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "deepks"
dynamic = ["version"]
description = "DeePKS-kit: generate accurate (self-consistent) energy functionals"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yixiao Chen", email = "yixiaoc@princeton.edu" },
]
keywords = ["deepks", "DeePKS-kit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "ase>=3.26,<4",
  "cupy-cuda12x==13.4.1",
  "cutensor-cu12==2.2.0",
  "gpu4pyscf-cuda12x>=1.8,<1.9",
  "numpy",
  "paramiko",
  "pyscf==2.14.*",
  "ruamel.yaml",
  "scipy",
  "torch",
]

[project.scripts]
deepks = "deepks.main:main_cli"
dks = "deepks.main:main_cli"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["deepks", "deepks.*"]

[tool.setuptools_scm]
write_to = "deepks/_version.py"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
